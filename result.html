<!DOCTYPE html><html>
<head>
    <title>Fake News Detection Results</title><style>
    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg,#4facfe,#00f2fe);
        margin:0;
        padding:30px;
    }

    .container{
        max-width:1000px;
        margin:auto;
    }

    .title{
        text-align:center;
        color:white;
        margin-bottom:25px;
    }

    .card{
        background:white;
        border-radius:15px;
        padding:20px;
        margin-bottom:20px;
        box-shadow:0 4px 15px rgba(0,0,0,0.15);
    }

    .card h2{
        margin-top:0;
        color:#333;
    }

    .accuracy-box{
        text-align:center;
        font-size:42px;
        font-weight:bold;
        color:#2196F3;
    }

    .prediction-grid{
        display:flex;
        flex-wrap:wrap;
        gap:12px;
    }

    .prediction-badge{
        padding:10px 18px;
        border-radius:25px;
        color:white;
        font-weight:bold;
    }

    .real{
        background:#4CAF50;
    }

    .fake{
        background:#F44336;
    }

    pre{
        white-space:pre-wrap;
        font-size:14px;
        overflow-x:auto;
    }
</style>

</head><body><div class="container"><h1 class="title">🎯 Fake News Detection Results</h1>

<div class="card">
    <h2>📰 Prediction Results</h2>

    <div class="prediction-grid">

        {% for p in predictions %}

            <div class="prediction-badge {% if p == 'Real News' %}real{% else %}fake{% endif %}">
                {{ p }}
            </div>

        {% endfor %}

    </div>
</div>

<div class="card">
    <h2>📊 Accuracy</h2>

    <div class="accuracy-box">
        {{ "%.2f"|format(accuracy*100) }}%
    </div>
</div>

<div class="card">
    <h2>📋 Classification Report</h2>

    <pre>{{ report }}</pre>
</div>

</div></body>
</html>
